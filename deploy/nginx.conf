# Nginx reverse proxy za Spartans Gym (Next.js `next start` na 127.0.0.1:3000).
#
# Postavljanje:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/spartansgym
#   sudo ln -s /etc/nginx/sites-available/spartansgym /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d spartansgym.rs -d www.spartansgym.rs
#
# Certbot će sam dodati 443 server blok i redirekciju sa 80 na 443.

# www -> bez www
server {
    listen 80;
    listen [::]:80;
    server_name www.spartansgym.rs;
    return 301 $scheme://spartansgym.rs$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name spartansgym.rs;

    # Nginx servira Next statiku direktno (hešovana imena -> trajni keš).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimizovane slike (next/image)
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /api/contact koristi ovaj header za rate-limit po IP-u
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ograniči veličinu tela zahteva (kontakt forma je mala)
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        image/svg+xml;
}
